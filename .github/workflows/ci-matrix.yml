# The DETERMINISTIC gate: typecheck + the full unit suite + a boot/compile smoke.
#
# It used to run on master only, so every branch and every push to `develop` —
# where the work actually happens — was gated by the Harness Suite alone: 60+
# specs that each spawn a real TUI on a shared 2-core runner. The cheap, stable
# check ran nowhere near the commits it could have caught, and the expensive,
# timing-sensitive one was the sole verdict. That is why CI reads as "always
# red": the signal came only from the flakiest layer.
name: ci-matrix
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions:
  contents: read

# A branch's newer push makes the older run's verdict irrelevant — cancel it
# rather than queueing 20-minute matrix runs behind each other.
concurrency:
  group: ci-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows gets 30, the others keep 20 — measured, not guessed. The unit
    # config runs files SERIALLY (vitest.config.ts `fileParallelism: false`), so
    # the job is ~960 file boots back to back, and a file boot costs ~2.2x more
    # on windows-latest than on macos-latest (per-file wall time from the CI
    # logs of the 2026-10-14 runs: 1122 s vs 500 s over the same 829 files).
    # That run was cancelled at 20 min with 133 files still to go (~67 s more).
    # After removing the avoidable waits (atomic-io's real 10 s step timeouts,
    # visible-retry's real 2 s backoffs, a real pyright booted by
    # msys-drive-path, the verify floor's timeout that did not kill a forked
    # gate on win32) the projection is ~18 min of vitest + ~1.3 min of
    # install/typecheck — ~97% of a 20 min budget, which no runner variance
    # survives. macOS ran the whole suite in 535 s, so 20 stays honest there.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.13"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build agent-harness-core (browser bundle)
        run: bun --filter @muonroi/agent-harness-core build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bunx vitest run
      - name: Boot smoke (headless)
        shell: bash
        run: |
          bun run src/index.ts --smoke-boot-only
          echo "Boot smoke OK (exit 0)"
  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: dist/muonroi-cli-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            outfile: dist/muonroi-cli-windows-x64.exe
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: dist/muonroi-cli-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.13"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} ./src/index.ts --outfile ${{ matrix.outfile }}
      - name: Verify binary exists
        shell: bash
        run: |
          ls -la ${{ matrix.outfile }}*
          echo "Binary compiled successfully for ${{ matrix.target }}"
