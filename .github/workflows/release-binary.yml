name: release-binary
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            outfile: muonroi-cli-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            outfile: muonroi-cli-windows-x64.exe
          - os: macos-latest
            target: bun-darwin-arm64
            outfile: muonroi-cli-darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.13"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build binary
        run: bun build --compile --target=${{ matrix.target }} ./src/index.ts --outfile dist/${{ matrix.outfile }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.outfile }}
          path: dist/${{ matrix.outfile }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "muonroi-cli ${{ github.ref_name }}" \
            --notes "## muonroi-cli ${{ github.ref_name }}

          ### Installation

          **npm:** \`npm install -g muonroi-cli\`

          **Standalone binary:** Download for your platform below.

          > **Note:** Standalone binaries use env-var API key (\`ANTHROPIC_API_KEY\`). OS keychain integration requires npm install.
          " \
            dist/*

  # npm trusted publishing (OIDC) — no NPM_TOKEN. muonroi-cli and the four
  # @muonroi/agent-harness-* packages list THIS workflow (muonroi/muonroi-cli,
  # release-binary.yml, no environment) as their Trusted Publisher on npmjs.com.
  # Renaming this file breaks publishing until each package's publisher is re-added.
  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Pinned to 11: npm@latest is now 12, which needs Node ^22.22.2 || ^24.15.0 and
      # failed EBADENGINE on a Node 20 runner (quick-codex run 42972704424, 2026-11-11).
      - name: npm with trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # Skip when this version is already on npm, like the harness loop below, so a re-run after a
      # later step failed does not die on "cannot publish over" (release v1.11.0, run 43000669223:
      # muonroi-cli published, then agent-harness-core failed E422 on an empty repository.url).
      - name: Publish muonroi-cli
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          status=$(node -e "fetch('https://registry.npmjs.org/$name/$version').then(r=>console.log(r.status))")
          if [ "$status" = "200" ]; then
            echo "skip $name@$version (already on npm)"
          elif [ "$status" = "404" ]; then
            npm publish --access public --provenance
          else
            echo "registry check for $name@$version returned $status" >&2
            exit 1
          fi
      - name: Publish agent-harness packages (versions not yet on npm)
        run: |
          set -euo pipefail
          # core first: opentui/react/angular depend on it.
          for pkg in core opentui react angular; do
            dir="packages/agent-harness-$pkg"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            # Plain registry read (no auth): setup-node exports a placeholder NODE_AUTH_TOKEN.
            # 200 = this version exists, 404 = not yet published; anything else fails the step.
            status=$(node -e "fetch('https://registry.npmjs.org/$name/$version').then(r=>console.log(r.status))")
            if [ "$status" != "200" ] && [ "$status" != "404" ]; then
              echo "registry check for $name@$version returned $status" >&2
              exit 1
            fi
            if [ "$status" = "200" ]; then
              echo "skip $name@$version (already on npm)"
              continue
            fi
            if node -e "process.exit(require('./$dir/package.json').scripts?.build ? 0 : 1)"; then
              (cd "$dir" && bun run build)
            fi
            (cd "$dir" && npm publish --access public --provenance)
          done
